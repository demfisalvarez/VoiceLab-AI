# Experimentos manuales con PyTorch (CPU) en Windows.
name: Experimento PyTorch
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de tools/ a ejecutar"
        default: "ci_bwe.py"
defaults:
  run:
    shell: pwsh
jobs:
  experimento:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch==2.5.1 torchaudio==2.5.1 "numpy<2.1" scipy gdown
      - run: python tools/${{ inputs.script }} ci-out
