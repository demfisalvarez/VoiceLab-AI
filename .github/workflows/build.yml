# Compila VoiceLab AI para Windows y lo prueba en Windows real:
#  - «app»: pruebas, ejecutable (PyInstaller), autocomprobación del .exe, instalador (Inno Setup),
#           instalación y desinstalación silenciosas.
#  - «modelos»: texto a voz, RVC y voz instantánea en directo con los modelos REALES.
#  - «publicar»: crea una versión en Releases con el instalador (manual o con una etiqueta v*).
name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      modelos:
        description: "Probar con los modelos reales"
        type: boolean
        default: true
      publicar:
        description: "Publicar el instalador en Releases"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt onnxruntime-directml tokenizers pyinstaller pytest
      - name: Pruebas
        run: python -m pytest -q -p no:cacheprovider
      - name: VB-CABLE (para probar el micrófono predeterminado)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          Set-Service Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile vbcable.zip
          Expand-Archive vbcable.zip -DestinationPath vbcable
          # Certificado del fabricante como editor de confianza: así la instalación silenciosa no pregunta.
          $sig = Get-AuthenticodeSignature vbcable\vbaudio_cable64_win10.cat -ErrorAction SilentlyContinue
          if (-not $sig.SignerCertificate) { $sig = Get-AuthenticodeSignature vbcable\VBCABLE_Setup_x64.exe }
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPublisher", "LocalMachine")
          $store.Open("ReadWrite"); $store.Add($sig.SignerCertificate); $store.Close()
          Start-Process vbcable\VBCABLE_Setup_x64.exe -ArgumentList "-i","-h" -Wait
          Start-Sleep 5
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table -AutoSize
      - name: Micrófono predeterminado de Windows (COM)
        timeout-minutes: 3
        run: python tools/ci_winmic.py
      - name: Versión
        id: ver
        run: |
          $v = python -c "import voicelab; print(voicelab.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Ejecutable (PyInstaller)
        run: pyinstaller build/VoiceLabAI.spec --noconfirm --distpath dist --workpath build/work
      - name: Incluir uv (para instalar la voz en directo desde el .exe)
        run: |
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip uvtmp -Force
          New-Item -ItemType Directory -Force "dist/VoiceLab AI/bin" | Out-Null
          Copy-Item (Get-ChildItem uvtmp -Recurse -Filter uv.exe | Select-Object -First 1).FullName "dist/VoiceLab AI/bin/uv.exe"
          & "dist/VoiceLab AI/bin/uv.exe" --version
      - name: Incluir un Python 3.12 completo (base de la voz en directo, sin uniones de directorio)
        run: |
          $env:UV_PYTHON_INSTALL_DIR = "$PWD\uvpy"
          & "dist/VoiceLab AI/bin/uv.exe" python install 3.12
          $real = Get-ChildItem uvpy -Directory | Where-Object { $_.Name -like 'cpython-3.12.*' -and -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } | Select-Object -First 1
          if (-not $real) { throw "No se encontró el Python descargado" }
          Copy-Item -Recurse $real.FullName "dist/VoiceLab AI/pybase"
          & "dist/VoiceLab AI/pybase/python.exe" -c "import sys, ssl, venv; print(sys.version)"
          $links = Get-ChildItem "dist/VoiceLab AI/pybase" -Recurse -Attributes ReparsePoint -ErrorAction SilentlyContinue
          if ($links) { throw "pybase contiene enlaces: $links" }
      - name: Autocomprobación del .exe
        run: |
          ./tools/ci_run_exe.ps1 -Exe "dist\VoiceLab AI\VoiceLab AI.exe" -Arguments '--selftest', "`"$PWD\selftest.json`"" -TimeoutSec 240 -DataDir "$PWD\st-datos" -Shot "$PWD\captura-selftest.png"
          $code = $LASTEXITCODE
          Get-Content selftest.json -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "Autocomprobación fallida ($code)" }
      - name: Voz en directo desde el .exe (entorno de PyTorch con uv)
        run: |
          ./tools/ci_run_exe.ps1 -Exe "dist\VoiceLab AI\VoiceLab AI.exe" -Arguments '--selftest-live', "`"$PWD\live.json`"" -TimeoutSec 900 -DataDir "$PWD\live-datos" -Shot "$PWD\captura-live.png"
          $code = $LASTEXITCODE
          Get-Content live.json -ErrorAction SilentlyContinue
          Get-Content "dist\VoiceLab AI\vc-runtime\pyvenv.cfg" -ErrorAction SilentlyContinue
          $links = Get-ChildItem "dist\VoiceLab AI" -Recurse -Attributes ReparsePoint -ErrorAction SilentlyContinue
          if ($links) { throw "Hay uniones/enlaces de directorio (Windows puede bloquearlas): $links" }
          Remove-Item -Recurse -Force "dist\VoiceLab AI\vc-runtime", "dist\VoiceLab AI\vc-python" -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "La voz en directo no funciona desde el .exe ($code)" }
      - name: Ventana real (WebView2)
        continue-on-error: true
        run: |
          ./tools/ci_run_exe.ps1 -Exe "dist\VoiceLab AI\VoiceLab AI.exe" -Arguments '--selftest-window', "`"$PWD\window.json`"" -TimeoutSec 240 -DataDir "$PWD\win-datos" -Shot "$PWD\captura-ventana.png"
          Get-Content window.json -ErrorAction SilentlyContinue
          if (-not (Get-Content window.json -ErrorAction Stop | ConvertFrom-Json).ok) { throw "La interfaz no llegó a estar lista" }
      - name: Instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $env:VL_VERSION = "${{ steps.ver.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length
      - name: Instalar, abrir y desinstalar en silencio
        run: |
          $setup = (Get-ChildItem dist\VoiceLabAI-Setup-*.exe | Select-Object -First 1).FullName
          $sp = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/LOG=instalacion.log' -PassThru
          if (-not $sp.WaitForExit(300000)) { throw "El instalador no terminó en 5 min" }
          $exe = "$env:LOCALAPPDATA\Programs\VoiceLab AI\VoiceLab AI.exe"
          if (-not (Test-Path $exe)) { throw "No se instaló $exe" }
          ./tools/ci_run_exe.ps1 -Exe $exe -Arguments '--selftest', "`"$PWD\selftest-instalado.json`"" -TimeoutSec 240 -DataDir "$PWD\inst-datos" -Shot "$PWD\captura-instalado.png"
          $code = $LASTEXITCODE
          Get-Content selftest-instalado.json -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "El programa instalado no pasa la autocomprobación" }
          $unins = Get-ChildItem "$env:LOCALAPPDATA\Programs\VoiceLab AI\unins*.exe" | Select-Object -First 1
          $up = Start-Process $unins.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $up.WaitForExit(300000)) { throw "El desinstalador no terminó en 5 min" }
          Start-Sleep 5
          if (Test-Path $exe) { throw "La desinstalación dejó el programa" }
      - name: Registros
        if: always()
        run: |
          New-Item -ItemType Directory -Force registros | Out-Null
          Copy-Item *.json, *.png, instalacion.log registros -ErrorAction SilentlyContinue
          foreach ($d in 'st-datos', 'win-datos', 'inst-datos') { if (Test-Path "$d\logs") { Copy-Item -Recurse "$d\logs" "registros\$d" } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registros-app
          path: registros
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLabAI-Setup
          path: dist/VoiceLabAI-Setup-*.exe

  modelos:
    # Descarga ~4 GB de modelos: solo al lanzarlo a mano (Actions → Windows → Run workflow) o con una etiqueta.
    if: (github.event_name == 'workflow_dispatch' && inputs.modelos) || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VOICELAB_DATA_DIR: ${{ github.workspace }}\ci-out\datos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt onnxruntime-directml tokenizers faster-whisper
      - name: Caché de modelos
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ci-out/datos/models
            ci-out/datos/vc-runtime
          key: modelos-${{ hashFiles('voicelab/ai/models.py', 'voicelab/ai/meanvc.py') }}
          restore-keys: modelos-
      - name: Voces de Windows disponibles
        run: |
          Add-Type -AssemblyName System.Speech
          (New-Object System.Speech.Synthesis.SpeechSynthesizer).GetInstalledVoices() | ForEach-Object { $_.VoiceInfo.Name }
      - name: Modelos reales
        run: python tools/ci_real_models.py ci-out
      - name: Guardar la caché de modelos (aunque alguna prueba falle)
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ci-out/datos/models
            ci-out/datos/vc-runtime
          key: modelos-${{ hashFiles('voicelab/ai/models.py', 'voicelab/ai/meanvc.py') }}
      - name: Recoger resultados
        if: always()
        run: |
          New-Item -ItemType Directory -Force resultados | Out-Null
          Copy-Item ci-out\*.wav, ci-out\*.json resultados -ErrorAction SilentlyContinue
          if (Test-Path ci-out\datos\logs) { Copy-Item -Recurse ci-out\datos\logs resultados\logs }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-modelos
          path: resultados

  publicar:
    needs: app
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoiceLabAI-Setup
      - name: Crear la versión
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          f=$(ls VoiceLabAI-Setup-*.exe | head -1)
          v=${f#VoiceLabAI-Setup-}; v=${v%.exe}
          gh release create "v$v" "$f" --repo "$GITHUB_REPOSITORY" --title "VoiceLab AI $v" \
            --notes "Instalador para Windows 10/11. Descarga **$f**, ábrelo y sigue el asistente. No necesitas Python." \
            || gh release upload "v$v" "$f" --repo "$GITHUB_REPOSITORY" --clobber
