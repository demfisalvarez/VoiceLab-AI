# Experimento manual: perfil del texto a voz con el modelo real.
name: Perfil texto a voz
on: workflow_dispatch
defaults:
  run:
    shell: pwsh
jobs:
  perfil:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VOICELAB_DATA_DIR: ${{ github.workspace }}\ci-out\datos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt onnxruntime-directml tokenizers faster-whisper
      - uses: actions/cache/restore@v4
        with:
          path: |
            ci-out/datos/models
            ci-out/datos/vc-runtime
          key: modelos-${{ hashFiles('voicelab/ai/models.py', 'voicelab/ai/meanvc.py') }}
          restore-keys: modelos-
      - run: python tools/ci_tts_profile.py ci-out
