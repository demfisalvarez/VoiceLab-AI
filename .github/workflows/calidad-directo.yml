# Mide calidad (inteligibilidad, parecido, entonación, DNSMOS) y retraso real de la voz
# instantánea en directo con los modelos reales, para varias configuraciones. Manual.
name: Calidad voz en directo
on:
  workflow_dispatch:
defaults:
  run:
    shell: pwsh
jobs:
  calidad:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VOICELAB_DATA_DIR: ${{ github.workspace }}\ci-out\datos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt onnxruntime-directml tokenizers faster-whisper
      - name: Caché de modelos
        uses: actions/cache/restore@v4
        with:
          path: |
            ci-out/datos/models
            ci-out/datos/vc-runtime
          key: modelos-${{ hashFiles('voicelab/ai/models.py', 'voicelab/ai/meanvc.py') }}
          restore-keys: modelos-
      - name: Calidad y retraso
        run: python tools/ci_live_quality.py ci-out
      - name: Registros
        if: always()
        run: |
          if (Test-Path ci-out\datos\logs) { Get-ChildItem ci-out\datos\logs | ForEach-Object { "----- $($_.Name)"; Get-Content $_.FullName -Tail 40 } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad-directo
          path: |
            ci-out/*.wav
            ci-out/*.json
